services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  server:
    build: .
    ports:
      - "1337:1337"
    environment:
      PARSE_MASTER_KEY: ${PARSE_MASTER_KEY:?set PARSE_MASTER_KEY in .env}
      DATABASE_URI: mongodb://mongo:27017/blog
    depends_on:
      - mongo

volumes:
  mongo-data:
